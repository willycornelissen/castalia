<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>Castalia — Redirecionando...</title>
    <script>
      // SPA redirect for GitHub Pages (preserves clean URLs across reloads)
      (function () {
        var l = window.location;
        var pathSegmentsToKeep = l.pathname.indexOf('/castalia/') === 0 ? 1 : 0;
        var base = l.pathname
          .split('/')
          .slice(0, 1 + pathSegmentsToKeep)
          .join('/');
        var routePath = l.pathname
          .slice(1)
          .split('/')
          .slice(pathSegmentsToKeep)
          .join('/')
          .replace(/&/g, '~and~');
        var query = l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '';
        l.replace(
          l.protocol +
            '//' +
            l.hostname +
            (l.port ? ':' + l.port : '') +
            base +
            '/?/' +
            routePath +
            query +
            l.hash
        );
      })();
    </script>
  </head>
  <body></body>
</html>

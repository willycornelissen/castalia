name: Deploy to Firebase Hosting

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-hosting
  cancel-in-progress: false

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Verify Secrets
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          FIREBASE_SERVICE_ACCOUNT_CASTALIA_5A039: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CASTALIA_5A039 }}
        run: |
          if [ -z "$VITE_FIREBASE_API_KEY" ]; then
            echo "::error::Configure os secrets VITE_FIREBASE_* em Settings -> Secrets and variables -> Actions antes do deploy."
            exit 1
          fi
          if [ -z "$FIREBASE_SERVICE_ACCOUNT_CASTALIA_5A039" ]; then
            echo "::error::Configure o secret FIREBASE_SERVICE_ACCOUNT_CASTALIA_5A039 em Settings -> Secrets and variables -> Actions (JSON da service account com permissão Firebase Hosting Admin)."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Build production SPA
        env:
          VITE_BASE_PATH: /
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ secrets.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ secrets.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_STORAGE_BUCKET: ${{ secrets.VITE_FIREBASE_STORAGE_BUCKET }}
          VITE_FIREBASE_MESSAGING_SENDER_ID: ${{ secrets.VITE_FIREBASE_MESSAGING_SENDER_ID }}
          VITE_FIREBASE_APP_ID: ${{ secrets.VITE_FIREBASE_APP_ID }}
          VITE_FIREBASE_ADMIN_UID: ${{ secrets.VITE_FIREBASE_ADMIN_UID }}
        run: npm run build

      - name: Deploy to Firebase Hosting (castalia.web.app)
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CASTALIA_5A039 }}
          channelId: live
          projectId: castalia-5a039
          target: castalia
